plugins {
    id "com.android.application"
}

android {
    namespace "com.olivierh.passingshot"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.olivierh.passingshot"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "0.1.0"
        manifestPlaceholders = [probeLockscreen: "false"]
    }

    sourceSets {
        main.res.srcDir layout.buildDirectory.dir("generated/gameResources")
    }

    signingConfigs {
        debug {
            // Reuse the private key that signs earlier development APKs.
            storeFile file(providers.gradleProperty("debugStoreFile").getOrElse("../../.cache/android-debug.keystore"))
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders.probeLockscreen = providers.gradleProperty("probeLockscreen").getOrElse("false")
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            // AGP aligns directly loaded native libraries for 16 KiB devices.
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files("libs/passingshot.aar")
}
